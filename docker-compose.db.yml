# =============================================================================
# Wedding Club - 数据库和缓存服务部署 (MySQL + Redis)
# =============================================================================
# 使用方法：docker-compose -f docker-compose.db.yml up -d
# =============================================================================

services:
  # MySQL 8.0 数据库服务
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=root_password_123
      - MYSQL_DATABASE=wedding_service
      - MYSQL_USER=wedding_service
      - MYSQL_PASSWORD=password_123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deployment/docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./deployment/logs/mysql:/var/log/mysql
    # 使用 mysql_native_password 以兼容旧版本客户端，并允许远程连接
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - db-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7.0 缓存服务
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # 启用密码保护
    command: redis-server --requirepass redis_password_123 --appendonly yes
    networks:
      - db-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  db-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
