# =============================================================================
# Wedding Club - Docker Compose 统一配置
# =============================================================================
# 支持多环境部署：dev/test/prod
# 使用方法：ENVIRONMENT=dev ./deploy.sh deploy
# =============================================================================

services:
  # =============================================================================
  # 前端Web应用服务 - 使用 env_file 指令
  # =============================================================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: production
    image: wedding-service-web:${ENVIRONMENT:-prod}-latest
    container_name: wedding-service-web-${ENVIRONMENT:-prod}
    restart: unless-stopped
    pull_policy: never
    ports:
      - "${WEB_INTERNAL_PORT:-8081}:80"
    # 直接指定环境变量文件
    env_file:
      - ./deployment/environments/.env.${ENVIRONMENT:-prod}
    # 也可以同时使用 environment 覆盖特定变量
    environment:
      - NODE_ENV=${NODE_ENV:-prod}
    networks:
      - wedding-service-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # =============================================================================
  # 后端API服务 - 使用 env_file 指令
  # =============================================================================
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    image: wedding-service-api:${ENVIRONMENT:-prod}-latest
    container_name: wedding-service-api-${ENVIRONMENT:-prod}
    restart: unless-stopped
    pull_policy: never
    ports:
      - "${SERVER_INTERNAL_PORT:-3000}:3000"
    # 动态加载环境变量文件
    env_file:
      - ./deployment/environments/.env.${ENVIRONMENT:-prod}
    # 只需要覆盖特定的环境变量
    environment:
      - NODE_ENV=${NODE_ENV:-prod}
      - PORT=3000
      - LOG_FILE=/app/logs/app.log
      - LOG_ERROR_FILE=/app/logs/error.log
    volumes:
      - ./deployment/uploads:/app/uploads
      - ./deployment/logs/api:/app/logs
    depends_on:
      - mysql
      - redis
    networks:
      - wedding-service-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =============================================================================
  # MySQL 数据库服务 - 使用统一的DB_前缀配置
  # =============================================================================
  mysql:
    image: mysql:8.0
    pull_policy: if_not_present
    container_name: wedding-service-mysql-${ENVIRONMENT:-prod}
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    # 动态加载环境变量文件
    env_file:
      - ./deployment/environments/.env.${ENVIRONMENT:-prod}
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deployment/docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./deployment/logs/mysql:/var/log/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - wedding-service-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # =============================================================================
  # Redis 缓存服务 - 使用 env_file 指令
  # =============================================================================
  redis:
    image: redis:7-alpine
    pull_policy: if_not_present
    container_name: wedding-service-redis-${ENVIRONMENT:-prod}
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    env_file:
      - ./deployment/environments/.env.${ENVIRONMENT:-prod}
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - redis_data:/data
      - ./deployment/docker/redis/redis.conf:/etc/redis/redis.conf:ro
      - ./deployment/logs/redis:/var/log/redis
    command: redis-server /etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    networks:
      - wedding-service-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # =============================================================================
  # MinIO 对象存储服务 - 使用统一的OSS_前缀配置
  # =============================================================================
  minio:
    image: minio/minio:latest
    pull_policy: if_not_present
    container_name: wedding-service-minio-${ENVIRONMENT:-prod}
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    env_file:
      - ./deployment/environments/.env.${ENVIRONMENT:-prod}
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./deployment/uploads:/data
      - ./deployment/logs/minio:/var/log/minio
    command: server /data --console-address ":9001"
    networks:
      - wedding-service-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  # =============================================================================
  # Nginx 反向代理 - 使用 env_file 指令
  # =============================================================================
  nginx:
    image: nginx:alpine
    pull_policy: if_not_present
    container_name: wedding-service-nginx-${ENVIRONMENT:-prod}
    restart: unless-stopped
    
    ports:
      - "${NGINX_PORT:-80}:80"
    env_file:
      - ./deployment/environments/.env.${ENVIRONMENT:-prod}
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-prod}
      - API_SERVICE_NAME=wedding-service-api-${ENVIRONMENT:-prod}
      - API_SERVICE_PORT=3000
      - WEB_SERVICE_NAME=wedding-service-web-${ENVIRONMENT:-prod}
      - WEB_SERVICE_PORT=80
      - MINIO_SERVICE_NAME=wedding-service-minio-${ENVIRONMENT:-prod}
      - MINIO_SERVICE_PORT=9000
      - SERVER_HOST=${SERVER_HOST:-localhost}
    volumes:
      - ./deployment/ssl:/etc/nginx/ssl:ro
      - ./deployment/logs/nginx:/var/log/nginx
      - ./deployment/uploads:/var/www/uploads:ro
      - ./deployment/docker/nginx/conf.d/default.conf.template:/etc/nginx/conf.d/default.conf.template:ro
      - ./deployment/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/scripts/nginx-entrypoint.sh:/usr/local/bin/nginx-entrypoint.sh:ro
      - nginx_cache:/var/cache/nginx
    command: ["/bin/sh", "/usr/local/bin/nginx-entrypoint.sh"]
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - wedding-service-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  loki:
    image: grafana/loki:2.9.6
    container_name: wedding-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./deployment/docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml
      - ./deployment/logs/loki:/tmp/loki
    command: -config.file=/etc/loki/loki-config.yaml -config.expand-env=true
    networks:
      - wedding-service-network

  promtail:
    image: grafana/promtail:2.9.6
    container_name: wedding-promtail
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deployment/logs:/var/log/wedding:ro
      - ./deployment/docker/promtail/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - wedding-service-network
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.2.3
    container_name: wedding-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - wedding-service-network
    depends_on:
      - loki

# =============================================================================
# 网络和数据卷配置保持不变
# =============================================================================
networks:
  wedding-service-network:
    driver: bridge
    name: wedding-service-${ENVIRONMENT:-prod}-network

volumes:
  mysql_data:
    name: wedding-service-mysql-${ENVIRONMENT:-prod}-data
  redis_data:
    name: wedding-service-redis-${ENVIRONMENT:-prod}-data
  minio_data:
    name: wedding-service-minio-${ENVIRONMENT:-prod}-data
  nginx_cache:
    name: wedding-service-nginx-${ENVIRONMENT:-prod}-cache
  grafana_data:
    name: wedding-grafana-data-${ENVIRONMENT:-prod}